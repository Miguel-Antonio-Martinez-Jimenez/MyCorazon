<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Mi Cachetona ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Roboto',sans-serif;
    min-height:100vh;
    transition:background 1s ease;
    overflow:hidden;
}

/* Fondos por hora */
.bg-madrugada{background:linear-gradient(135deg,#cfe9ff,#e6f4ff);}
.bg-manana{background:linear-gradient(135deg,#fff3c4,#fff9e6);}
.bg-tarde{background:linear-gradient(135deg,#ffd6e8,#ffe9f2);}

/* Reloj */
#clock{
    position:fixed;
    top:15px;
    right:20px;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(10px);
    padding:12px 18px;
    border-radius:18px;
    font-weight:600;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
    z-index:10;
}

/* Reloj del amor */
#love-timer{
    background:rgba(255,255,255,.8);
    backdrop-filter:blur(14px);
    border-radius:28px;
    padding:26px;
    margin-bottom:50px;
    margin-top:30px;
    box-shadow:0 25px 50px rgba(0,0,0,.18);
}

.love-title{
    font-family:'Pacifico',cursive;
    font-size:clamp(2rem,4vw,2.8rem);
    color:#ff4d8d;
    margin-bottom:20px;
}

/* Tiempo */
.time-box{
    background:rgba(255,255,255,.95);
    border-radius:18px;
    padding:14px;
    min-width:90px;
    box-shadow:0 10px 20px rgba(0,0,0,.12);
}
.time-number{font-size:1.8rem;font-weight:700;color:#ff4d8d;}
.time-label{font-size:.75rem;color:#777;text-transform:uppercase;letter-spacing:1px;}

/* 💖 CARDS */
.card-link{
    text-decoration:none;
    color:inherit;
    display:block;
    height:100%;
}

.love-card{
    height:100%;
    border-radius:26px;
    overflow:hidden;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(14px);
    box-shadow:0 20px 45px rgba(0,0,0,.18);
    transition:all .45s ease;
}
.love-card:hover{
    transform:translateY(-12px);
    box-shadow:0 35px 70px rgba(139,92,246,.45); /* 💜 NUEVO COLOR */
}

/* Imagen */
.love-card-img{
    position:relative;
    overflow:hidden;
}
.love-card-img img{
    width:100%;
    height:200px;
    object-fit:cover;
    transition:transform .6s ease;
}
.love-card:hover img{transform:scale(1.12);}

.love-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to top,rgba(139,92,246,.45),rgba(0,0,0,.05));
}

.love-icon{
    position:absolute;
    top:14px;
    right:14px;
    background:rgba(255,255,255,.9);
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
    color:#8b5cf6;
    box-shadow:0 10px 20px rgba(0,0,0,.2);
}

/* Contenido */
.love-card-body{
    padding:22px;
    text-align:center;
}

.love-card-title{
    font-weight:700;
    font-size:1.25rem;
    color:#8b5cf6;
    margin-bottom:8px;
}

.love-card-date{
    font-size:.85rem;
    color:#777;
    display:flex;
    justify-content:center;
    gap:6px;
}
.love-card-date span{color:#8b5cf6;}

/* Preloader */
#preloader{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#ffd6e8,#cfe9ff);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    transition:opacity 1s ease,visibility 1s ease;
}
#preloader.hide{opacity:0;visibility:hidden;}

.preloader-text{
    font-family:'Pacifico',cursive;
    font-size:clamp(2rem,5vw,3rem);
    color:#ff4d8d;
    animation:heartbeat 1.8s infinite;
}
@keyframes heartbeat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.1);}
}
</style>
</head>

<body class="d-flex align-items-center justify-content-center">

<div id="preloader"><div class="preloader-text">❤️ Te amo mi cachetona hermosa ❤️</div></div>

<!-- Reloj del amor -->

        <div class="time-box"><div id="minutes" class="time-number">0</div><div class="time-label">Min</div></div>
        <div class="time-box"><div id="seconds" class="time-number">0</div><div class="time-label">Seg</div></div>
    </div>

<!-- 💜 Cards con hipervínculo -->
<div class="row g-4 mb-5" style="justify-content: center;">

<div class="col-12 col-md-6 col-lg-3">
<a href="https://miguel-antonio-martinez-jimenez.github.io/ParaMyLucy/" class="card-link">

<div class="col-12 col-md-6 col-lg-3">

<img src="img/Imagen2.png">

<script>
const clock=document.getElementById('clock');
const ids=['years','months','days','hours','minutes','seconds'].map(id=>document.getElementById(id));

function updateClockAndBackground(){
    const n=new Date(),h=n.getHours();
    clock.textContent=`${String(h%12||12).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')} ${h>=12?'PM':'AM'}`;
    document.body.className='d-flex align-items-center justify-content-center '+(h<8?'bg-madrugada':h<13?'bg-manana':'bg-tarde');
}

function updateLoveTimer(){
    const s=new Date(2025,7,6),n=new Date();
    let y=n.getFullYear()-s.getFullYear(),m=n.getMonth()-s.getMonth(),d=n.getDate()-s.getDate();
    if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate();}
    if(m<0){y--;m+=12;}
    const diff=n-new Date(s.getFullYear()+y,s.getMonth()+m,s.getDate());
    const vals=[y,m,d,Math.floor(diff/3600000)%24,Math.floor(diff/60000)%60,Math.floor(diff/1000)%60];
    ids.forEach((el,i)=>el.textContent=Math.max(0,vals[i]));
}

setInterval(()=>{updateClockAndBackground();updateLoveTimer();},1000);
window.onload=()=>setTimeout(()=>{preloader.classList.add('hide');document.body.style.overflow='auto';},1800);
</script>

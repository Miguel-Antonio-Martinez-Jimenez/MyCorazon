<!DOCTYPE html>
<!-- Base estilo HTML5 Boilerplate -->
<html class="no-js" lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<title>Para mi Cachetona ❤️</title>
<meta name="description" content="Nuestro rinconcito de recuerdos">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e0457b">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Pacifico&display=swap" rel="stylesheet">

<!-- Bootstrap + Bootstrap Icons (los que se usan en la página) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<!-- Tailwind (solo utilidades sueltas) -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={corePlugins:{preflight:false}}</script>

<!--
  Milligram y Skeleton NO se activan: redefinen h1, button, .container, .row
  y chocan con Bootstrap. Si quieres usar uno en lugar de Bootstrap, quita
  Bootstrap y descomenta UNO de estos:
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css">
-->

<style>
:root{
  --rosa:#e0457b; --rosa-suave:#ffd9e6;
  --lila:#7c4dff; --lila-suave:#e7defe;
  --sol:#ffc933;  --crema:#fff6f1;
  --texto:#3b2a3f; --gris:#7d6b82;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--texto);
  min-height:100vh;margin:0;overflow-x:hidden;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  background:var(--bg,linear-gradient(160deg,#ffe3ee,#fff6f1));
  background-attachment:fixed;transition:background 1.5s ease;
}
/* Fondos por hora: cambia las clases desde JS */
body.bg-madrugada{--bg:linear-gradient(160deg,#d7e8ff,#f1e6ff)}
body.bg-manana{--bg:linear-gradient(160deg,#fff1b8,#fff8ea)}
body.bg-tarde{--bg:linear-gradient(160deg,#ffd0e2,#ffe9d6)}
body.bg-noche{--bg:linear-gradient(160deg,#2c2150,#5b3a7a);--texto:#fff4fa;--gris:#d9c8e6}
body.bg-noche .glass{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
body.bg-noche .time-box{background:rgba(255,255,255,.14)}

.glass{
  background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.7);box-shadow:0 18px 45px rgba(124,77,255,.15);
}

/* Corazones flotando */
#hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.float-heart{position:absolute;bottom:-40px;opacity:0;animation:subir linear forwards}
@keyframes subir{
  10%{opacity:.8}
  100%{transform:translate(var(--dx),-110vh) rotate(var(--rot));opacity:0}
}

/* Preloader */
#preloader{
  position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
  background:linear-gradient(135deg,#ffd0e2,#e7defe);
  transition:opacity 1s ease,visibility 1s ease;
}
#preloader.hide{opacity:0;visibility:hidden}
.pre-heart{font-size:4rem;animation:latido 1.2s infinite}
.pre-text{font-family:'Pacifico',cursive;font-size:clamp(1.8rem,6vw,2.8rem);color:var(--rosa)}
@keyframes latido{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.15)}}

/* Reloj */
#clock{
  position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:20;
  padding:8px 14px;border-radius:999px;font-weight:800;font-size:.9rem;
  font-variant-numeric:tabular-nums;
}

main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:70px 16px 40px}

/* Portada */
.hero{text-align:center;margin-bottom:28px}
.hero h1{
  font-family:'Pacifico',cursive;font-size:clamp(2.6rem,9vw,4.8rem);
  color:var(--rosa);margin:0;line-height:1.15;text-shadow:0 6px 24px rgba(224,69,123,.25);
}
.hero p{color:var(--gris);font-size:1.1rem;margin:10px 0 0}

/* Contador */
.timer{border-radius:32px;padding:28px 18px;margin-bottom:56px;text-align:center}
.timer h2{font-family:'Pacifico',cursive;color:var(--lila);font-size:clamp(1.5rem,4vw,2.1rem);margin-bottom:18px}
.time-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:12px;max-width:720px;margin:0 auto}
.time-box{background:#fff;border-radius:20px;padding:14px 6px;box-shadow:0 8px 18px rgba(0,0,0,.08)}
.time-number{font-size:2rem;font-weight:800;color:var(--rosa);line-height:1;font-variant-numeric:tabular-nums}
.time-label{font-size:.75rem;color:var(--gris);font-weight:600;margin-top:6px}
.timer .desde{color:var(--gris);font-size:.9rem;margin:16px 0 0}

/* Título de sección */
.section-title{text-align:center;margin-bottom:26px}
.section-title h2{font-weight:800;font-size:1.6rem;margin:0}
.section-title p{color:var(--gris);margin:4px 0 0}

/* Tarjetas de recuerdos */
.memory{
  display:block;height:100%;text-decoration:none;color:inherit;
  border-radius:28px;overflow:hidden;transition:transform .4s ease,box-shadow .4s ease;
  opacity:0;transform:translateY(24px);
}
.memory.visible{opacity:1;transform:none;transition:opacity .7s ease,transform .7s ease,box-shadow .4s ease}
.memory:hover{transform:translateY(-10px) rotate(-.6deg);box-shadow:0 30px 60px rgba(124,77,255,.35);color:inherit}
.memory:focus-visible{outline:3px solid var(--sol);outline-offset:4px}
.memory-img{position:relative;height:210px;overflow:hidden;background:linear-gradient(135deg,var(--rosa-suave),var(--lila-suave))}
.memory-img img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
.memory:hover .memory-img img{transform:scale(1.1)}
.memory-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(124,77,255,.4),transparent 60%)}
.memory-badge{
  position:absolute;top:14px;right:14px;z-index:2;width:44px;height:44px;border-radius:50%;
  background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;
  box-shadow:0 8px 18px rgba(0,0,0,.2)
}
.memory-body{padding:20px 20px 22px;text-align:center}
.memory-title{font-weight:800;font-size:1.25rem;color:var(--lila);margin:0 0 6px}
.memory-date{color:var(--gris);font-size:.9rem}
.memory-date i{color:var(--rosa);margin-right:4px}
.memory-text{color:var(--gris);font-size:.92rem;margin:8px 0 0}

/* Tarjeta "próximamente" */
.memory.soon{border:2px dashed var(--lila);background:rgba(255,255,255,.4);box-shadow:none;cursor:default}
.memory.soon:hover{transform:none;box-shadow:none}
.soon-inner{height:100%;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--lila);padding:20px;text-align:center}
.soon-inner i{font-size:3rem;animation:latido 2.4s infinite}

footer{text-align:center;color:var(--gris);padding:20px 0 10px;font-size:.95rem}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .memory{opacity:1;transform:none}
}
</style>
</head>

<body>
<div id="preloader" role="status">
  <div class="pre-heart">💖</div>
  <div class="pre-text" id="pre-text">Te amo</div>
</div>

<div id="hearts" aria-hidden="true"></div>
<div id="clock" class="glass">--:--:--</div>

<main>
  <header class="hero">
    <h1 id="titulo">Para mi Cachetona</h1>
    <p id="subtitulo">Cada día contigo es mi recuerdo favorito</p>
  </header>

  <section class="timer glass">
    <h2><i class="bi bi-hourglass-split"></i> Nuestro tiempo juntos</h2>
    <div class="time-grid">
      <div class="time-box"><div id="years" class="time-number">0</div><div class="time-label">Años</div></div>
      <div class="time-box"><div id="months" class="time-number">0</div><div class="time-label">Meses</div></div>
      <div class="time-box"><div id="days" class="time-number">0</div><div class="time-label">Días</div></div>
      <div class="time-box"><div id="hours" class="time-number">0</div><div class="time-label">Horas</div></div>
      <div class="time-box"><div id="minutes" class="time-number">0</div><div class="time-label">Minutos</div></div>
      <div class="time-box"><div id="seconds" class="time-number">0</div><div class="time-label">Segundos</div></div>
    </div>
    <p class="desde" id="desde"></p>
  </section>

  <div class="section-title">
    <h2>Nuestros recuerdos</h2>
    <p>Toca uno para entrar</p>
  </div>

  <!-- Las tarjetas se crean solas desde la lista RECUERDOS (abajo) -->
  <div class="row g-4 justify-content-center" id="recuerdos"></div>

  <footer>Hecho con <i class="bi bi-heart-fill" style="color:var(--rosa)"></i> por Miguel</footer>
</main>

<script>
/* =====================================================
   ✏️  AQUÍ EDITAS TODO — no necesitas tocar nada más
   ===================================================== */
const CONFIG = {
  titulo: "Para mi Cachetona",
  subtitulo: "Cada día contigo es mi recuerdo favorito",
  mensajeCarga: "Te amo mi cachetona hermosa",
  inicio: new Date(2025, 7, 6),   // (año, mes-1, día) → 6 agosto 2025
  mostrarTarjetaProximamente: true,
  corazones: ["❤️","💖","💜","🌻","✨"]
};

/* Para agregar un recuerdo nuevo: copia un bloque { ... }, pégalo al final
   de la lista (antes del ]) y cambia los datos. */
const RECUERDOS = [
  { titulo:"Para mi Lucy",     fecha:"01 Septiembre 2025", link:"https://miguel-antonio-martinez-jimenez.github.io/ParaMyLucy/",
    imagen:"Imagen1.png", emoji:"❤️", icono:"bi-calendar-heart" },
  { titulo:"Flores Amarillas", fecha:"21 Septiembre 2025", link:"https://miguel-antonio-martinez-jimenez.github.io/Flores/",
    imagen:"Imagen2.png", emoji:"✨", icono:"bi-flower1" },
  { titulo:"Mi San Valentín",  fecha:"25 Enero 2026",      link:"https://miguel-antonio-martinez-jimenez.github.io/SanValentin/",
    imagen:"Imagen3.png", emoji:"😻", icono:"bi-balloon-heart" },
  { titulo:"Flores Amarillas", fecha:"21 Septiembre 2026", link:"https://miguel-antonio-martinez-jimenez.github.io/21-SEPT-2026/",
    imagen:"Imagen4.png", emoji:"🏵️", icono:"bi-flower2",
    texto:"Nuestro primer año" }   // "texto" es opcional
];

/* =====================================================
   ⚙️  Motor (no hace falta editar)
   ===================================================== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");

// Textos
document.title = CONFIG.titulo + " ❤️";
$("titulo").textContent = CONFIG.titulo;
$("subtitulo").textContent = CONFIG.subtitulo;
$("pre-text").textContent = CONFIG.mensajeCarga;
$("desde").textContent = "Desde el " + CONFIG.inicio.toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"});

// Tarjetas
const cont = $("recuerdos");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
RECUERDOS.forEach(r => {
  const col = document.createElement("div");
  col.className = "col-12 col-sm-6 col-lg-3";
  col.innerHTML = `
    <a class="memory glass" href="${esc(r.link)}">
      <div class="memory-img">
        <img src="${esc(r.imagen)}" alt="${esc(r.titulo)}" loading="lazy" onerror="this.remove()">
        <div class="memory-badge">${esc(r.emoji||"❤️")}</div>
      </div>
      <div class="memory-body">
        <h3 class="memory-title">${esc(r.titulo)}</h3>
        <div class="memory-date"><i class="bi ${esc(r.icono||"bi-calendar-heart")}"></i>${esc(r.fecha)}</div>
        ${r.texto ? `<p class="memory-text">${esc(r.texto)}</p>` : ""}
      </div>
    </a>`;
  cont.appendChild(col);
});
if (CONFIG.mostrarTarjetaProximamente) {
  const col = document.createElement("div");
  col.className = "col-12 col-sm-6 col-lg-3";
  col.innerHTML = `<div class="memory soon"><div class="soon-inner">
    <i class="bi bi-plus-circle-dotted"></i><strong>Nuestro futuro</strong><span>Aquí vendrá el próximo recuerdo</span></div></div>`;
  cont.appendChild(col);
}

// Aparecer al hacer scroll
const io = new IntersectionObserver((es,o)=>es.forEach(e=>{
  if(e.isIntersecting){ e.target.classList.add("visible"); o.unobserve(e.target); }
}),{threshold:.15});
document.querySelectorAll(".memory").forEach((m,i)=>{ m.style.transitionDelay=(i*90)+"ms"; io.observe(m); });

// Reloj + fondo según la hora
function actualizarReloj(){
  const n = new Date(), h = n.getHours();
  $("clock").textContent = `${pad(h%12||12)}:${pad(n.getMinutes())}:${pad(n.getSeconds())} ${h>=12?"PM":"AM"}`;
  const clase = h<6 ? "bg-noche" : h<8 ? "bg-madrugada" : h<13 ? "bg-manana" : h<19 ? "bg-tarde" : "bg-noche";
  document.body.className = clase;
}

// Contador del amor
const unidades = ["years","months","days","hours","minutes","seconds"].map($);
function actualizarAmor(){
  const s = CONFIG.inicio, n = new Date();
  let y = n.getFullYear()-s.getFullYear(), m = n.getMonth()-s.getMonth(), d = n.getDate()-s.getDate();
  if(d<0){ m--; d += new Date(n.getFullYear(), n.getMonth(), 0).getDate(); }
  if(m<0){ y--; m += 12; }
  const diff = n - new Date(s.getFullYear()+y, s.getMonth()+m, s.getDate());
  const v = [y, m, d, Math.floor(diff/3600000)%24, Math.floor(diff/60000)%60, Math.floor(diff/1000)%60];
  unidades.forEach((el,i)=> el.textContent = Math.max(0,v[i]));
}

// Corazones flotando
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function nuevoCorazon(){
  if(reduce || document.hidden) return;
  const el = document.createElement("span");
  el.className = "float-heart";
  el.textContent = CONFIG.corazones[Math.floor(Math.random()*CONFIG.corazones.length)];
  el.style.left = Math.random()*100 + "vw";
  el.style.fontSize = (14 + Math.random()*22) + "px";
  el.style.setProperty("--dx", (Math.random()*120-60) + "px");
  el.style.setProperty("--rot", (Math.random()*80-40) + "deg");
  el.style.animationDuration = (8 + Math.random()*8) + "s";
  $("hearts").appendChild(el);
  el.addEventListener("animationend", () => el.remove());
}

actualizarReloj(); actualizarAmor();
setInterval(()=>{ actualizarReloj(); actualizarAmor(); }, 1000);
setInterval(nuevoCorazon, 900);

// Quitar preloader
window.addEventListener("load", () => setTimeout(() => $("preloader").classList.add("hide"), 1800));
</script>
</body>
</html>
